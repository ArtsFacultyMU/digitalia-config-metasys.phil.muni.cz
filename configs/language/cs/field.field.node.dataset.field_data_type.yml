label: 'Typ Dat'
description: 'Vyberte všechny relevantní termíny popisující typ dat, v případě, že vhodné pojmy chybí, můžete přidat nové. Typem dat se rozumí např. data číselná, textová, obrazová, prostorová nebo 3D. Záznam je to, o čem jsou v datasetu shromažďovány informace, např. osoba, dokument, organizace, událost, měření nebo artefakt.'
